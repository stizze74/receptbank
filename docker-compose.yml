services:
  recept-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recept-web
    restart: unless-stopped
    ports:
      # Bakup-mapping till localhost om man vill testa NPM-förbi
      - "127.0.0.1:8087:80"
    networks:
      - docker_default
    labels:
      - "se.hjerne.recept=v1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # NPM (nginx-proxy) bor på docker_default — vi joinar den för att kunna
  # nås via service-namn (recept-web) från NPM:s proxy-host-konfig.
  docker_default:
    external: true
