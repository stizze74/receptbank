server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Komprimering
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Cache headers
    location ~* ^/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Service worker — aldrig cache:as länge
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # Astro genererar /recept/foo/index.html — try_files hanterar alla varianter
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html /index.html;
    }

    # Sitemaps
    location = /sitemap.xml {
        add_header Content-Type "application/xml";
    }
    location = /sitemap-index.xml {
        add_header Content-Type "application/xml";
    }

    # Säkerhetsheaders
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tystare access-loggar för hälsokontroll
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
